name: Palomar preflight

# Runs Palomar's own verification job against a commit before submitting it.
# The workflow reference and pipeline_commit must name the same PalomarSubmission commit.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit to check (default is this run's commit)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit || github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      # Palomar requires twelve lowercase letters or digits.
      request_id: preflightrun
      mode: full
      execution_profile: palomar-standard-v1
      # The same optional fields a submission sends: a new version of the existing entry.
      options: >-
        {"existing_id": "PALOMAR-2026-10-04-000003",
         "authorization_relationship": "I am a responsible author or maintainer",
         "comparator_config_path": "comparator.json",
         "formalization_metadata_path": "formalization.yaml"}
