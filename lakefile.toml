name = "covering"
version = "2.0.0"
defaultTargets = ["Covering", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0-rc3"

# The proof, organized by the sections of the paper (see README.md).
[[lean_lib]]
name = "Covering"

# The Palomar submission: the statements, and their proofs from Covering.Main.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
